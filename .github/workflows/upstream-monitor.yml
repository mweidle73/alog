name: Upstream Monitor

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-upstream:
    name: Compare Codelabs master
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the GitHub master mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with Codelabs
        shell: bash
        run: |
          set -euo pipefail
          upstream_url=https://git.codelabs.ch/git/alog.git
          git fetch --no-tags \
            "$upstream_url" \
            refs/heads/master:refs/remotes/codelabs/master

          github_sha=$(git rev-parse HEAD)
          codelabs_sha=$(git rev-parse refs/remotes/codelabs/master)
          read -r github_only codelabs_only <<EOF
          $(git rev-list --left-right --count \
            HEAD...refs/remotes/codelabs/master)
          EOF

          mirror_tags=$(mktemp)
          upstream_tags=$(mktemp)
          trap 'rm -f "$mirror_tags" "$upstream_tags"' EXIT
          list_release_tags() {
            git ls-remote --tags "$1" |
              awk '$2 !~ /\^\{\}$/ {
                name = $2
                sub("^refs/tags/", "", name)
                if (name ~ /^v[0-9]/) print name "\t" $1
              }' |
              LC_ALL=C sort
          }
          list_release_tags origin > "$mirror_tags"
          list_release_tags "$upstream_url" > "$upstream_tags"
          tag_count=$(wc -l < "$mirror_tags" | tr -d ' ')
          tags_match=true
          if ! diff -u "$mirror_tags" "$upstream_tags"; then
            tags_match=false
          fi

          {
            echo "## Codelabs upstream status"
            echo
            echo "| Ref | Commit |"
            echo "| --- | --- |"
            echo "| GitHub \`master\` | \`$github_sha\` |"
            echo "| Codelabs \`master\` | \`$codelabs_sha\` |"
            echo
            echo "GitHub-only commits: $github_only"
            echo
            echo "Codelabs-only commits: $codelabs_only"
            echo
            echo "Mirrored release tags: $tag_count"
            echo
            echo "Release-tag refs match: $tags_match"
          } >> "$GITHUB_STEP_SUMMARY"

          if test "$github_sha" != "$codelabs_sha"; then
            echo "GitHub master differs from Codelabs master" >&2
            master_matches=false
          else
            master_matches=true
          fi
          if test "$master_matches" != true || test "$tags_match" != true; then
            echo "Upstream mirror review is required" >&2
            exit 1
          fi
